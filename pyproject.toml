[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucination-probes"
version = "0.1.0"
description = "Cross-domain hallucination detection from LLM hidden states (SALA, MLP, fusion, VLM, polysemantic probes)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.26,<3",
    "scikit-learn>=1.3,<2",
    "pandas>=2,<3",
    "tqdm>=4.60",
    "transformers>=4.51.3,<5",
    "datasets>=3.3.1,<5",
    "huggingface-hub>=0.30,<1",
    "safetensors>=0.4",
]

[project.optional-dependencies]
extract = [
    "accelerate>=1,<2",
    "sentencepiece>=0.2,<1",
    "bitsandbytes>=0.45.5,<0.50",
    "bleurt-pytorch @ git+https://github.com/lucadiliello/bleurt-pytorch.git@279ca1bb4106bde5a89f0f82723197e23d8446cb",
]
dev = ["pytest>=7", "pyflakes"]

[project.scripts]
hprobes = "hprobes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
